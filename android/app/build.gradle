plugins { id 'com.android.application' }

android {
    namespace 'com.easycode.quran'
    compileSdk 34

    defaultConfig {
        applicationId "com.easycode.quran"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            storeFile file("quran.keystore")
            storePassword "quran2026"
            keyAlias "quran"
            keyPassword "quran2026"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies { }
