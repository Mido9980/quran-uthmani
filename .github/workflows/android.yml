name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Generate keystore
        run: |
          keytool -genkeypair -v -keystore android/app/quran.keystore \
            -alias quran -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass quran2026 -keypass quran2026 \
            -dname "CN=EASY CODE, OU=Quran, O=EASY CODE, L=Cairo, S=Cairo, C=EG"

      - name: Build release APK
        run: gradle -p android assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: quran-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
